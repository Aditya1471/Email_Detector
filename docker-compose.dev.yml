version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: phishguard-db-dev
    environment:
      POSTGRES_DB: phishguard
      POSTGRES_USER: phishguard
      POSTGRES_PASSWORD: development-password-999
    volumes:
      - phishguard_postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phishguard -d phishguard"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: phishguard-migrate-dev
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+psycopg://phishguard:development-password-999@db:5432/phishguard
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: phishguard-api-dev
    # Exclude production restrictions for local reload mounts
    volumes:
      - ./backend/app:/workspace/app
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      APP_NAME: "PhishGuard API (Dev)"
      DATABASE_URL: postgresql+psycopg://phishguard:development-password-999@db:5432/phishguard
      JWT_SECRET_KEY: replace-with-a-long-random-development-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      ALLOWED_CORS_ORIGINS: http://localhost:5500,http://127.0.0.1:5500,http://localhost:8000
      ALLOWED_HOSTS: localhost,127.0.0.1,api,db
      USE_MOCK_API: "false"
      LOG_LEVEL: DEBUG
      RATE_LIMIT_ENABLED: "false"
      QUEUE_ENABLED: "true"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: phishguard-redis-dev
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: phishguard-worker-dev
    command: celery -A app.worker.celery_app worker --loglevel=INFO --concurrency=1
    volumes:
      - ./backend/app:/workspace/app
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://phishguard:development-password-999@db:5432/phishguard
      JWT_SECRET_KEY: replace-with-a-long-random-development-secret
      TOKEN_ENCRYPTION_KEY: qO9LSTDQJdKmym0dqxcC42v1VlZUXQhBTWJ6sfIewUw=
      QUEUE_ENABLED: "true"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      LOG_LEVEL: DEBUG
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  phishguard_postgres_data_dev:

