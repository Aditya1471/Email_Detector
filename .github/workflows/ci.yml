name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Code Quality & Integration Tests
    runs-on: ubuntu-latest
    
    services:
      db:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: phishguard_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest psycopg[binary]
          pip install -r backend/requirements.txt

      - name: Run Format Check
        run: ruff format --check backend

      - name: Run Lint Check
        run: ruff check backend

      - name: Run Frontend Assets Validation
        run: python backend/tests/validate_frontend.py

      - name: Verify Alembic Migrations
        env:
          DATABASE_URL: postgresql+psycopg://test_user:test_password@localhost:5432/phishguard_test
        run: |
          cd backend
          alembic upgrade head
          alembic current
          alembic history

      - name: Run Backend Tests
        env:
          TEST_DATABASE_URL: sqlite+pysqlite:///./test.db
          APP_ENV: test
          USE_MOCK_API: "false"
          JWT_SECRET_KEY: test-signing-secret-key-just-for-ci-runs-9999
          RATE_LIMIT_ENABLED: "false"
        run: |
          python -m pytest backend/tests/ -v

  docker:
    name: Docker Build & User Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        run: |
          docker build -t phishguard-api:ci ./backend

      - name: Verify Non-Root User Execution
        run: |
          USER_OUT=$(docker run --rm phishguard-api:ci whoami)
          echo "Container running as user: $USER_OUT"
          if [ "$USER_OUT" != "phishguard" ]; then
            echo "❌ Error: Container runs as '$USER_OUT' instead of 'phishguard' user!"
            exit 1
          fi
          echo "✅ Container non-root execution verified successfully."

  secrets-scan:
    name: Secrets & Credentials Safety
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for Committed Env/Database Files
        run: |
          echo "Checking for unsafe files committed to repo..."
          
          # Check for raw env files (excluding .env.example)
          ENV_FILES=$(find . -name "*.env" -not -name "*.env.example" | grep -v "node_modules" | grep -v ".venv" || true)
          if [ ! -z "$ENV_FILES" ]; then
            echo "❌ Error: Unsafe environment configuration files found in repository:"
            echo "$ENV_FILES"
            exit 1
          fi
          
          # Check for sqlite db files
          DB_FILES=$(find . -name "*.db" -o -name "*.sqlite" -o -name "*.sqlite3" | grep -v ".venv" || true)
          # Exclude test.db as it might be used for local verify tests, but ensure no real client databases are committed
          if [ ! -z "$DB_FILES" ]; then
            echo "⚠️ Warning: Database file(s) found in repository. Ensure they do not contain sensitive data:"
            echo "$DB_FILES"
          fi
          
          echo "✅ Repository files scan completed successfully."
