<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberGuard - Enterprise Security Gateway</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Custom styling -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <!-- Font Awesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body.login-body {
            background: radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.15) 0%, rgba(0, 0, 0, 0) 40%), var(--bg-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 480px;
            padding: 40px;
            border-radius: 24px;
            transition: var(--transition-smooth);
        }

        .login-logo {
            font-size: 34px;
            font-weight: 800;
            margin-bottom: 4px;
            text-align: center;
        }

        .login-sub {
            color: var(--text-secondary);
            margin-bottom: 24px;
            font-size: 14px;
            text-align: center;
        }

        .auth-tabs {
            display: flex;
            gap: 4px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 24px;
        }

        .auth-tab {
            flex: 1;
            padding: 8px;
            border-radius: 8px;
            border: none;
            background: none;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 14px;
            transition: var(--transition-smooth);
            cursor: pointer;
        }

        .auth-tab.active {
            background: var(--gradient-accent);
            color: #FFF;
        }

        .social-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .social-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-weight: 600;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: var(--transition-smooth);
        }

        .social-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-1px);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: var(--text-muted);
            font-size: 11px;
            margin: 20px 0;
            letter-spacing: 1px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-color);
        }

        .divider:not(:empty)::before { margin-right: .5em; }
        .divider:not(:empty)::after { margin-left: .5em; }

        .security-banner {
            font-size: 11px;
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.15);
            color: var(--color-phishing);
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: left;
        }
    </style>
</head>
<body class="login-body">
    <div class="login-card glass-panel">
        <div class="login-logo">
            <i class="fa-solid fa-envelope-open-text text-info me-2"></i>
            <span>Phish<span class="gradient-text">Guard</span></span>
        </div>
        <div class="login-sub">AI-Powered Phishing Email Detection Website</div>

        <!-- Corporate warning banner -->
        <div class="security-banner">
            <i class="fa-solid fa-triangle-exclamation me-2"></i>
            <strong>WARNING:</strong> This is a secure system. All authentication actions and incident audits are logged for verification and compliance.
        </div>
        
        <!-- Tabs -->
        <div class="auth-tabs">
            <button class="auth-tab active" id="tab-login-btn">LOG IN</button>
            <button class="auth-tab" id="tab-signup-btn">SIGN UP</button>
        </div>

        <div id="alert-box" class="d-none alert border-0 rounded-3 text-start small mb-3" role="alert"></div>

        <!-- Enterprise Identity Providers -->
        <div class="social-grid">
            <button class="social-btn" id="google-login-btn">
                <i class="fa-brands fa-google text-danger"></i>
                <span>Google Workspace</span>
            </button>
            <button class="social-btn" id="guest-login-btn">
                <i class="fa-solid fa-flask text-info"></i>
                <span>Sandbox Demo</span>
            </button>
        </div>

        <div class="divider">STANDARD LDAP SIGN-IN</div>

        <!-- LOGIN FORM PANEL -->
        <div id="login-panel">
            <form id="login-form">
                <div class="mb-3">
                    <label class="form-label text-secondary small fw-semibold">Email or Phone Number</label>
                    <div class="position-relative">
                        <input type="text" class="form-input ps-4" id="login-id" placeholder="e.g. analyst@cyberguard-security.com" required>
                        <i class="fa-solid fa-user position-absolute start-0 top-50 translate-middle-y ms-3 text-secondary small" style="opacity:0.6;"></i>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label text-secondary small fw-semibold">Security Password</label>
                    <div class="position-relative">
                        <input type="password" class="form-input ps-4" id="login-password" placeholder="Input security password..." required>
                        <i class="fa-solid fa-lock position-absolute start-0 top-50 translate-middle-y ms-3 text-secondary small" style="opacity:0.6;"></i>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-3" id="submit-login-btn">
                    <i class="fa-solid fa-key me-2"></i>Authenticate Credentials
                </button>
            </form>
        </div>

        <!-- SIGNUP FORM PANEL -->
        <div id="signup-panel" class="d-none">
            <form id="signup-form">
                <div class="mb-3">
                    <label class="form-label text-secondary small fw-semibold">Full Name</label>
                    <div class="position-relative">
                        <input type="text" class="form-input ps-4" id="signup-name" placeholder="e.g. Analyst Jane Doe" required>
                        <i class="fa-solid fa-signature position-absolute start-0 top-50 translate-middle-y ms-3 text-secondary small" style="opacity:0.6;"></i>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label text-secondary small fw-semibold">Corporate Email Address (Optional if Phone provided)</label>
                    <div class="position-relative">
                        <input type="email" class="form-input ps-4" id="signup-email" placeholder="e.g. analyst@cyberguard-security.com">
                        <i class="fa-solid fa-envelope position-absolute start-0 top-50 translate-middle-y ms-3 text-secondary small" style="opacity:0.6;"></i>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label text-secondary small fw-semibold">Mobile Phone Number (Optional if Email provided)</label>
                    <div class="position-relative">
                        <input type="text" class="form-input ps-4" id="signup-phone" placeholder="e.g. +919999988888">
                        <i class="fa-solid fa-phone position-absolute start-0 top-50 translate-middle-y ms-3 text-secondary small" style="opacity:0.6;"></i>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label text-secondary small fw-semibold">Security Password (Min 6 chars)</label>
                    <div class="position-relative">
                        <input type="password" class="form-input ps-4" id="signup-password" placeholder="Create a strong account password..." required minlength="6">
                        <i class="fa-solid fa-lock position-absolute start-0 top-50 translate-middle-y ms-3 text-secondary small" style="opacity:0.6;"></i>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-3" id="submit-signup-btn">
                    <i class="fa-solid fa-user-plus me-2"></i>Register Security Account
                </button>
            </form>
        </div>

        <!-- local developer simulator action -->
        <div class="text-center mt-4">
            <button class="btn btn-link text-info text-decoration-none small" id="simulator-login-btn" style="font-size: 12px;">
                <i class="fa-solid fa-laptop-code me-1"></i>Launch Developer SOC Simulator Session
            </button>
        </div>
    </div>

    <!-- UI Interaction Scripts -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Panels and Tabs
            const tabLogin = document.getElementById('tab-login-btn');
            const tabSignup = document.getElementById('tab-signup-btn');
            const loginPanel = document.getElementById('login-panel');
            const signupPanel = document.getElementById('signup-panel');
            const alertBox = document.getElementById('alert-box');

            function showAlert(msg, isSuccess=false) {
                alertBox.className = 'alert border-0 rounded-3 text-start small mb-3';
                alertBox.classList.add(isSuccess ? 'alert-success' : 'alert-danger');
                alertBox.textContent = msg;
                alertBox.classList.remove('d-none');
            }

            // Tab Switching Animation triggers
            tabLogin.addEventListener('click', () => {
                tabLogin.classList.add('active');
                tabSignup.classList.remove('active');
                loginPanel.classList.remove('d-none');
                signupPanel.classList.add('d-none');
                alertBox.classList.add('d-none');
            });

            tabSignup.addEventListener('click', () => {
                tabSignup.classList.add('active');
                tabLogin.classList.remove('active');
                signupPanel.classList.remove('d-none');
                loginPanel.classList.add('d-none');
                alertBox.classList.add('d-none');
            });

            // 1. Google OAuth Authentication Call
            document.getElementById('google-login-btn').addEventListener('click', () => {
                fetch('/api/auth/google/login')
                    .then(resp => resp.json())
                    .then(data => {
                        if (data.status === 'success' && data.auth_url) {
                            window.location.href = data.auth_url;
                        } else if (data.status === 'warning') {
                            showAlert("OAuth keys unconfigured. Launching Local Security Simulator...", true);
                            setTimeout(() => { triggerMockLogin(); }, 1500);
                        } else {
                            showAlert(data.message || 'Google Auth failed.');
                        }
                    })
                    .catch(() => showAlert('OAuth service unreachable.'));
            });

            // Developer Mock bypass handler
            function triggerMockLogin() {
                fetch('/api/auth/mock-login', { method: 'POST' })
                    .then(resp => resp.json())
                    .then(data => {
                        if (data.status === 'success') {
                            window.location.href = '/dashboard';
                        } else {
                            showAlert(data.message || 'Mock login failed.');
                        }
                    });
            }

            document.getElementById('simulator-login-btn').addEventListener('click', triggerMockLogin);

            // 2. Guest Login triggers
            document.getElementById('guest-login-btn').addEventListener('click', () => {
                fetch('/api/auth/guest-login', { method: 'POST' })
                    .then(resp => resp.json())
                    .then(data => {
                        if (data.status === 'success') {
                            window.location.href = '/dashboard';
                        } else {
                            showAlert(data.message || 'Sandbox session startup failed.');
                        }
                    })
                    .catch(() => showAlert('Auth server unreachable.'));
            });

            // 3. Email/Phone Password Login Handler
            document.getElementById('login-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const loginId = document.getElementById('login-id').value;
                const pass = document.getElementById('login-password').value;

                fetch('/api/auth/manual-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login_id: loginId, password: pass })
                })
                .then(resp => {
                    if (resp.status === 401) {
                        showAlert('Invalid login credentials.');
                        return null;
                    }
                    return resp.json();
                })
                .then(data => {
                    if (!data) return;
                    if (data.status === 'success') {
                        window.location.href = '/dashboard';
                    } else {
                        showAlert(data.message || 'Authentication failed.');
                    }
                })
                .catch(() => showAlert('Auth server unreachable.'));
            });

            // 4. Registration Sign Up Form Handler
            document.getElementById('signup-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const name = document.getElementById('signup-name').value;
                const email = document.getElementById('signup-email').value;
                const phone = document.getElementById('signup-phone').value;
                const pass = document.getElementById('signup-password').value;

                if (!email && !phone) {
                    showAlert('You must input an email address or phone number to register.');
                    return;
                }

                const payload = {
                    full_name: name,
                    email: email,
                    phone_number: phone,
                    password: pass
                };

                fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                })
                .then(resp => {
                    if (resp.status === 409) {
                        showAlert('Account conflict: Email address or Phone number already registered.');
                        return null;
                    }
                    return resp.json();
                })
                .then(data => {
                    if (!data) return;
                    if (data.status === 'success') {
                        showAlert('Account created successfully! Switching to Login tab...', true);
                        document.getElementById('signup-form').reset();
                        document.getElementById('login-id').value = email ? email : phone;
                        setTimeout(() => {
                            tabLogin.click();
                        }, 2000);
                    } else {
                        showAlert(data.message || 'Registration failed.');
                    }
                })
                .catch(() => showAlert('Auth server unreachable.'));
            });
        });
    </script>
</body>
</html>
