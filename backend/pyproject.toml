[tool.ruff]
# Target Python version matching base docker images
target-version = "py311"
line-length = 160

# Excluded folders (under root tool.ruff section)
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "migrations"
]

[tool.ruff.lint]
# Enable standard Pyflakes (F), Pycodestyle (E, W), Bugbear (B), Isort (I), and Security (S)
select = ["F", "E", "W", "B", "I", "S"]
ignore = [
    "S101", # Allow assert statements in pytest files
    "B008", # Allow FastAPI Depends() route declarations
    "S105", # Allow constant strings like "bearer" token_type
    "S110", # Allow silent exceptions pass in parsers
    "B904", # Allow raising exceptions without explicit cause chaining
    "W291", # Allow trailing whitespaces in doc comments
    "W293"  # Allow blank line whitespaces in doc comments
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"**/__init__.py" = ["F401", "E402"]
"app/models/*.py" = ["F821"]

[tool.pytest.ini_options]
# Set the pythonpath to allow seamless imports inside tests
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]
